<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ResearchHub - Profile</title>
    <!-- Google Fonts & Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind-config.js"></script>

    <!-- Global CSS -->
    <link href="../css/global.css" rel="stylesheet" />
</head>

<body
    class="flex h-screen w-screen overflow-hidden text-body-base font-body-base bg-surface-container-lowest text-on-surface">
    <!-- Activity Bar (Dock) -->
    <div
        class="w-dock-width h-full bg-surface-container flex flex-col items-center py-lg border-r border-outline-variant flex-shrink-0 z-10">
        <div class="mb-xl">
            <span class="material-symbols-outlined text-primary cursor-pointer active:scale-95 transition-transform"
                data-icon="science" style="font-variation-settings: 'FILL' 1;">science</span>
        </div>
        <div class="flex flex-col gap-lg flex-grow">
            <!-- Inactive Navigation (My Projects) -->
            <a href="dashboard.html"
                class="p-xs text-on-surface-variant hover:text-on-surface cursor-pointer flex items-center justify-center w-8 h-8 transition-colors group relative border-l-2 border-transparent">
                <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                <div
                    class="absolute left-full ml-sm px-sm py-xs bg-surface-container-highest border border-outline-variant rounded text-on-surface text-code-sm font-code-sm opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 shadow-[0_4px_12px_rgba(0,0,0,0.4)]">
                    My Projects
                </div>
            </a>
            <!-- Inactive Navigation (Notifications) -->
            <a href="notifications.html"
                class="p-xs text-on-surface-variant hover:text-on-surface cursor-pointer flex items-center justify-center w-8 h-8 transition-colors group relative border-l-2 border-transparent">
                <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
                <div id="notificationBadge"
                    class="absolute top-0 right-0 w-3 h-3 bg-error rounded-full border-2 border-surface-container hidden">
                </div>
                <div
                    class="absolute left-full ml-sm px-sm py-xs bg-surface-container-highest border border-outline-variant rounded text-on-surface text-code-sm font-code-sm opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 shadow-[0_4px_12px_rgba(0,0,0,0.4)]">
                    Notifications
                </div>
            </a>
        </div>
        <div class="flex flex-col gap-lg mt-auto">
            <!-- Active Navigation -->
            <a href="profile.html"
                class="p-xs bg-primary-container/20 rounded border-l-2 border-primary cursor-pointer flex items-center justify-center w-8 h-8 group relative">
                <span class="material-symbols-outlined text-primary" data-icon="account_circle"
                    style="font-variation-settings: 'FILL' 1;">account_circle</span>
                <div
                    class="absolute left-full ml-sm px-sm py-xs bg-surface-container-highest border border-outline-variant rounded text-on-surface text-code-sm font-code-sm opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 shadow-[0_4px_12px_rgba(0,0,0,0.4)]">
                    Profile
                </div>
            </a>
            <div id="logoutBtn"
                class="p-xs text-on-surface-variant hover:text-on-surface cursor-pointer flex items-center justify-center w-8 h-8 transition-colors group relative">
                <span class="material-symbols-outlined" data-icon="logout">logout</span>
                <div
                    class="absolute left-full ml-sm px-sm py-xs bg-surface-container-highest border border-outline-variant rounded text-on-surface text-code-sm font-code-sm opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 shadow-[0_4px_12px_rgba(0,0,0,0.4)]">
                    Logout
                </div>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col h-screen min-w-0 bg-surface-container-lowest relative">
        <!-- TopAppBar -->
        <header
            class="flex justify-between items-center w-full px-lg h-[48px] bg-surface border-b border-outline-variant flex-shrink-0">
            <div class="flex items-center gap-md">
                <h2 class="font-title-sm text-title-sm font-bold text-on-surface flex items-center gap-xs">
                    <span class="material-symbols-outlined text-[18px] text-primary"
                        data-icon="account_circle">account_circle</span>
                    Profile
                </h2>
            </div>
            <!-- Toolbar Actions -->
            <div class="flex items-center gap-md">
                <div id="offlineBadge"
                    class="hidden items-center gap-xs px-sm h-[28px] bg-surface-container-high text-on-surface-variant border border-outline-variant rounded font-code-sm text-code-sm transition-all duration-300">
                    <span class="material-symbols-outlined text-[16px]">cloud_off</span>
                    Offline
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-xl">
            <div class="max-w-2xl mx-auto">
                <div class="mb-xl text-center">
                    <div id="profileAvatar"
                        class="w-32 h-32 rounded-full bg-primary-container text-on-primary-container text-4xl flex items-center justify-center mx-auto mb-md font-bold">
                        U
                    </div>
                    <h1 id="profileName" class="font-headline-md text-headline-md text-on-surface font-bold">User Name
                    </h1>
                    <p id="profileEmail" class="font-body-large text-body-large text-on-surface-variant mt-sm">
                        user@example.com</p>
                </div>

                <div class="bg-surface border border-outline-variant rounded-lg p-lg">
                    <div class="flex justify-between items-center mb-md border-b border-outline-variant pb-xs">
                        <h3 class="font-title-md text-title-md font-bold">Account Information</h3>
                        <button id="editProfileBtn"
                            class="text-primary hover:text-inverse-primary transition-colors font-title-sm text-title-sm flex items-center gap-xs">
                            <span class="material-symbols-outlined text-[18px]">edit</span> Edit
                        </button>
                    </div>

                    <!-- View Mode -->
                    <div id="profileViewMode" class="grid grid-cols-1 md:grid-cols-2 gap-md">
                        <div>
                            <p class="font-body-sm text-on-surface-variant">Full Name</p>
                            <p id="profileViewName" class="font-body-base text-on-surface font-medium"></p>
                        </div>
                        <div>
                            <p class="font-body-sm text-on-surface-variant">Email</p>
                            <p id="profileViewEmail" class="font-body-base text-on-surface font-medium"></p>
                        </div>
                    </div>

                    <!-- Edit Mode -->
                    <div id="profileEditMode" class="hidden mt-4">
                        <form id="profileEditForm" class="flex flex-col gap-md">
                            <div>
                                <label for="editName"
                                    class="block font-body-sm text-body-sm text-on-surface-variant mb-xs">Full
                                    Name</label>
                                <input type="text" id="editName"
                                    class="w-full bg-surface-container-low border border-outline-variant rounded px-md py-sm text-on-surface focus:outline-none focus:border-primary"
                                    placeholder="Enter your full name">
                            </div>
                            <div>
                                <label for="currentPassword"
                                    class="block font-body-sm text-body-sm text-on-surface-variant mb-xs">Current
                                    Password (Required)</label>
                                <input type="password" id="currentPassword"
                                    class="w-full bg-surface-container-low border border-outline-variant rounded px-md py-sm text-on-surface focus:outline-none focus:border-primary"
                                    placeholder="••••••••" required>
                            </div>
                            <div>
                                <label for="editPassword"
                                    class="block font-body-sm text-body-sm text-on-surface-variant mb-xs">New Password
                                    (leave blank to keep current)</label>
                                <input type="password" id="editPassword"
                                    class="w-full bg-surface-container-low border border-outline-variant rounded px-md py-sm text-on-surface focus:outline-none focus:border-primary"
                                    placeholder="••••••••">
                            </div>
                            <div class="flex justify-end gap-sm mt-sm">
                                <button type="button" id="cancelEditBtn"
                                    class="px-md py-2 rounded border border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors font-title-sm text-title-sm">Cancel</button>
                                <button type="submit" id="saveProfileBtn"
                                    class="px-md py-2 rounded bg-primary text-on-primary hover:bg-inverse-primary transition-colors font-title-sm text-title-sm">Save
                                    Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/profile.js"></script>
</body>

</html>
