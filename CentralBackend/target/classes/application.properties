spring.application.name=ResearchHub
server.port=8080

# MySQL Connection (same as you'd put in a PHP config file)
spring.datasource.url=jdbc:mysql://localhost:3306/researchhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-run schema.sql on startup is disabled manually as requested
spring.sql.init.mode=never

# Allow large file uploads (for dataset zip files stored in database)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Chat Server Port
chat.server.port=9090
