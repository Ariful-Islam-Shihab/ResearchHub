spring.application.name=ResearchHubLocal
server.port=8081

# SQLite Connection for Local Storage
spring.datasource.url=jdbc:sqlite:local_database.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Auto-run schema.sql on startup is disabled manually as requested
spring.sql.init.mode=never

# Central Server Configuration
central.api.url=http://localhost:8080/api
